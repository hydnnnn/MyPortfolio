<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020202">
  <meta name="description" content="Hayden S. Lagman — BSIT Programming Portfolio and Digital Archive">
  <title>Hayden S. Lagman | Programming Portfolio</title>

  <!-- Faster non-blocking font loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=VT323&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #020202;
      --surface: #0a0a0a;
      --text: #e0e0e0;
      --muted: #aaa;
      --vhs-green: #2ecc71;
      --vhs-blue: #3498db;
      --vhs-red: #e74c3c;
      --line: rgba(255, 255, 255, 0.15);
      --max: 1160px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 82px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      line-height: 1.6;
      overflow-x: hidden;
    }

    body.no-scroll {
      overflow: hidden;
    }

    /* Global CRT Scanline Overlay */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 999;
      pointer-events: none;
      background:
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 3px, 3px 100%;
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }

    :focus-visible {
      outline: 2px solid var(--vhs-green);
      outline-offset: 3px;
    }

    .container {
      width: min(var(--max), calc(100% - 40px));
      margin-inline: auto;
    }

    /* VHS Glitch Text Effect */
    .glitch {
      position: relative;
      text-shadow:
        0.05em 0 0 var(--vhs-red),
        -0.025em -0.05em 0 var(--vhs-green),
        0.025em 0.05em 0 var(--vhs-blue);
      animation: glitch 2s infinite;
    }

    @keyframes glitch {
      0%, 14% {
        text-shadow: 0.05em 0 0 var(--vhs-red), -0.05em -0.025em 0 var(--vhs-green), -0.025em 0.05em 0 var(--vhs-blue);
      }
      15%, 49% {
        text-shadow: -0.05em -0.025em 0 var(--vhs-red), 0.025em 0.025em 0 var(--vhs-green), -0.05em -0.05em 0 var(--vhs-blue);
      }
      50%, 99% {
        text-shadow: 0.025em 0.05em 0 var(--vhs-red), 0.05em 0 0 var(--vhs-green), 0 -0.05em 0 var(--vhs-blue);
      }
      100% {
        text-shadow: -0.025em 0 0 var(--vhs-red), -0.025em -0.025em 0 var(--vhs-green), -0.025em -0.05em 0 var(--vhs-blue);
      }
    }

    /* Navigation */
    .topbar {
      position: fixed;
      inset: 0 0 auto;
      z-index: 50;
      height: 72px;
      background: rgba(2, 2, 2, 0.92);
      backdrop-filter: blur(4px);
      border-bottom: 2px solid var(--vhs-blue);
    }

    .nav {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      font-family: 'VT323', monospace;
      font-size: 2rem;
      color: var(--text);
    }

    .brand span {
      color: var(--vhs-green);
      animation: blink 1s step-end infinite;
    }

    .nav-links {
      display: flex;
      gap: 26px;
      align-items: center;
    }

    .nav-links a {
      color: var(--muted);
      font-size: 0.9rem;
      text-transform: uppercase;
      transition: color 0.2s, text-shadow 0.2s;
    }

    .nav-links a:hover {
      color: var(--vhs-green);
      text-shadow: 0 0 5px var(--vhs-green);
    }

    .menu-toggle {
      display: none;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--vhs-green);
      padding: 8px 12px;
      cursor: pointer;
    }

    /* Typography & Shared Elements */
    h1, h2, h3 {
      font-family: 'VT323', monospace;
      text-transform: uppercase;
      font-weight: normal;
    }

    .eyebrow {
      color: var(--vhs-green);
      font-size: 1rem;
      font-family: 'VT323', monospace;
      letter-spacing: 0.1em;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      border: 2px solid var(--text);
      background: transparent;
      color: var(--text);
      text-transform: uppercase;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s, transform 0.2s;
    }

    .btn:hover {
      background: var(--text);
      color: var(--bg);
      box-shadow: 4px 4px 0 var(--vhs-blue);
      transform: translate(-2px, -2px);
    }

    /* Hero Section */
    .hero {
      min-height: 760px;
      display: grid;
      align-items: center;
      padding: 140px 0 90px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr;
      text-align: center;
      gap: 30px;
    }

    h1 {
      font-size: clamp(3rem, 10vw, 6rem);
      line-height: 1;
      margin: 10px 0;
      color: #fff;
    }

    h1 span { color: var(--vhs-blue); }

    .hero-subtitle {
      max-width: 600px;
      margin: 20px auto;
      color: var(--muted);
    }

    .hero-actions {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 30px;
    }

    /* Sections */
    section {
      padding: 80px 0;
      border-bottom: 1px dashed var(--line);
    }

    .section-head {
      margin-bottom: 40px;
      text-align: center;
    }

    .section-head h2 { font-size: clamp(2.5rem, 5vw, 4rem); }
    .section-head h2 span { color: var(--vhs-red); }

    /* About Grid */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 30px;
      align-items: center;
    }

    .about-copy h3 {
      font-size: 2.5rem;
      margin-bottom: 15px;
      line-height: 1.1;
    }

    .about-copy p + p {
      margin-top: 15px;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .tag {
      display: inline-block;
      border: 1px solid var(--vhs-blue);
      padding: 5px 10px;
      font-size: 0.8rem;
      color: var(--vhs-blue);
    }

    /* CRT Television Profile Picture */
    .tv-container {
      background: #1a1a1a;
      border: 4px solid #333;
      border-radius: 15px;
      padding: 15px 25px 15px 15px;
      display: flex;
      gap: 15px;
      box-shadow: inset 5px 5px 10px rgba(255, 255, 255, 0.05), 10px 10px 0 rgba(0, 0, 0, 0.8);
      position: relative;
      width: 100%;
      max-width: 350px;
      margin: 0 auto;
    }

    .tv-screen-wrapper {
      flex: 1;
      background: #050505;
      border: 12px solid #0a0a0a;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.1);
    }

    .tv-screen {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .tv-screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .tv-screen::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 4px, 4px 100%;
      pointer-events: none;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9);
    }

    .tv-osd {
      position: absolute;
      top: 10px;
      left: 15px;
      z-index: 10;
      color: var(--vhs-green);
      font-family: 'VT323', monospace;
      font-size: 1.5rem;
      text-shadow: 2px 2px 0 #000;
      animation: blink 1.5s step-end infinite;
    }

    .tv-panel {
      width: 35px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      justify-content: center;
    }

    .tv-knob {
      width: 30px;
      height: 30px;
      background: #2a2a2a;
      border-radius: 50%;
      border: 2px solid #444;
      box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .tv-knob::after {
      content: "";
      position: absolute;
      top: 4px;
      left: 11px;
      width: 4px;
      height: 10px;
      background: #777;
      border-radius: 2px;
    }

    .tv-knob--ch { transform: rotate(45deg); }
    .tv-knob--vol { transform: rotate(-30deg); }

    .tv-speaker {
      flex: 1;
      margin-top: 5px;
      border-radius: 4px;
      background: repeating-linear-gradient(0deg, #111, #111 3px, #222 3px, #222 6px);
    }

    /* Lab Tasks */
    .task-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .task-card {
      border: 2px solid var(--line);
      padding: 25px;
      background: var(--surface);
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .task-card:hover {
      border-color: var(--vhs-green);
      background: #000;
      box-shadow: 3px 3px 0 var(--vhs-red), -3px -3px 0 var(--vhs-blue);
      transform: translateY(-3px);
    }

    .task-top {
      display: flex;
      justify-content: space-between;
      color: var(--vhs-green);
      font-family: 'VT323', monospace;
      font-size: 1.2rem;
    }

    .task-card h3 {
      font-size: 2rem;
      margin: 15px 0;
      line-height: 1.1;
    }

    .task-link {
      display: inline-block;
      margin-top: 15px;
      margin-right: 18px;
      color: #fff;
      text-decoration: underline;
      text-decoration-color: var(--vhs-blue);
      text-underline-offset: 4px;
      transition: color 0.15s;
    }

    .task-link:hover { color: var(--vhs-green); }

    .placeholder-box {
      grid-column: 1 / -1;
      padding: 40px 20px;
      border: 2px dashed var(--line);
      text-align: center;
      font-family: 'VT323', monospace;
      font-size: 1.5rem;
      color: #777;
    }

    /* Contact Section */
    .contact-wrap { text-align: center; }

    .contact-lead {
      margin: 0 auto 25px;
      color: var(--muted);
      max-width: 500px;
    }

    .contact-heading {
      font-size: 2rem;
      margin-bottom: 18px;
    }

    .contact-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    /* Footer & Audio Panel */
    footer {
      padding: 30px 20px 90px;
      text-align: center;
      font-size: 1rem;
      font-family: 'VT323', monospace;
      color: var(--muted);
    }

    .music-panel {
      position: fixed;
      z-index: 60;
      right: 20px;
      bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 15px;
      background: #000;
      border: 2px solid var(--text);
    }

    .music-panel button {
      background: transparent;
      border: 1px solid var(--vhs-green);
      color: var(--vhs-green);
      padding: 5px 10px;
      cursor: pointer;
      font-family: 'VT323', monospace;
      font-size: 1.2rem;
      transition: background 0.15s, color 0.15s;
    }

    .music-panel button:hover {
      background: var(--vhs-green);
      color: #000;
    }

    .music-track {
      font-family: 'VT323', monospace;
      font-size: 1.2rem;
      color: #fff;
    }

    .music-panel audio { display: none; }

    /* Animated VHS Welcome Sequence */
    .welcome-screen {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #050505;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .welcome-screen.leaving {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .welcome-screen.is-gone {
      display: none;
    }

    .welcome-content { text-align: center; }

    .welcome-title {
      font-family: 'VT323', monospace;
      font-size: clamp(3rem, 8vw, 5rem);
      color: #fff;
      margin-bottom: 10px;
      line-height: 1;
    }
